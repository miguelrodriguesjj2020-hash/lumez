name: Aurora PT-BR

on:
  push:
    paths:
      - 'nuvio-ptbr/**'
      - '.github/workflows/nuvio-ptbr.yml'
  pull_request:
    paths:
      - 'nuvio-ptbr/**'
      - '.github/workflows/nuvio-ptbr.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: nuvio-ptbr

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm run verify

  sources:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 4
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Source smoke test (external availability)
        run: node scripts/live.mjs --probe --require-results --output reports/live.json
      - name: Redacted diagnostic report
        if: always()
        run: |
          if test -f reports/live.json; then
            cat reports/live.json
          fi
